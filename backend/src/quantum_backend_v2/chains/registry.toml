# Part of #2. Metadata is independent of wallet/payment support.
# Sources and pinned-provider compatibility: backend/CHAIN_REGISTRY.md
default_chain_id = "eip155:84532"

[[chains]]
chain_id = "eip155:84532"
family = "evm"
display_name = "Base Sepolia"
testnet = true
enabled = true
aliases = ["base-sepolia"]
rpc_env_var = "QB2_BASE_SEPOLIA_RPC_URL"
public_rpc_url = "https://sepolia.base.org"
capabilities = [
  "explorer_url", "create_wallet", "get_balance", "transfer_stablecoin",
  "verify_transaction", "aave_supply", "aave_withdraw", "faucet_instructions",
]
# Preserve the legacy escrow configuration; deployment verification is separate.
aave_pool_address = "0x07eA79F68B2B3df564D0A34F8e19D9B1e339814b"

[chains.provider_aliases]
agentkit = "base-sepolia"
cdp = "base-sepolia"

[chains.explorers]
transaction = "https://sepolia.basescan.org/tx/{tx_hash}"
address = "https://sepolia.basescan.org/address/{address}"
block = "https://sepolia.basescan.org/block/{block_number}"

[chains.native_token]
symbol = "ETH"
decimals = 18

[chains.stablecoin]
symbol = "USDC"
decimals = 6
address = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"

[[chains]]
chain_id = "eip155:11155111"
family = "evm"
display_name = "Ethereum Sepolia"
testnet = true
enabled = true
aliases = ["ethereum-sepolia"]
rpc_env_var = "QB2_ETHEREUM_SEPOLIA_RPC_URL"
public_rpc_url = "https://sepolia.drpc.org"
capabilities = ["explorer_url", "verify_transaction"]

[chains.provider_aliases]
agentkit = "ethereum-sepolia"
cdp = "ethereum-sepolia"

[chains.explorers]
transaction = "https://sepolia.etherscan.io/tx/{tx_hash}"
address = "https://sepolia.etherscan.io/address/{address}"
block = "https://sepolia.etherscan.io/block/{block_number}"

[chains.native_token]
symbol = "ETH"
decimals = 18

[chains.stablecoin]
symbol = "USDC"
decimals = 6
address = "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
